name: Publish
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs npm CLI >= 11.5.1; Node 24 ships npm 11.x and the
      # explicit upgrade removes the version as a variable.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing floor)
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # No NODE_AUTH_TOKEN on purpose: the npm CLI uses the OIDC trusted-publisher
      # flow when a token is absent, and prefers it when one is present.
      - name: Publish lib to npm
        run: npm publish --workspace packages/tokrec --provenance --access public

      - name: Publish cli to npm
        run: npm publish --workspace packages/cli --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*/dist/**
            LICENSE
          generate_release_notes: true
